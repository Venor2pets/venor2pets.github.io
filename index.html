<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venor2 Pet Tracker</title>
<style>
:root{--bg:#060810;--panel:#0d111b;--panel2:#111827;--line:rgba(255,255,255,.085);--muted:#8f99ac;--text:#f5f7fb;--accent:#6d7dff;--accent2:#9b6cff;--green:#35d391;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(900px 520px at 8% -8%,rgba(82,108,255,.26),transparent 63%),
radial-gradient(850px 500px at 96% 0%,rgba(166,86,255,.22),transparent 60%),
radial-gradient(760px 480px at 50% 105%,rgba(42,224,158,.075),transparent 68%),
radial-gradient(420px 260px at 50% 35%,rgba(255,255,255,.018),transparent 70%),
linear-gradient(180deg,#0b0f1b 0%,#070a12 52%,#03050a 100%);background-attachment:scroll}
button,input,select{font:inherit}.app{min-height:100vh}
.hero{position:relative;z-index:20;padding:11px clamp(16px,4.5vw,72px) 12px;background:linear-gradient(180deg,rgba(6,8,16,.97),rgba(6,8,16,.88));backdrop-filter:blur(8px) saturate(1.08);border-bottom:1px solid rgba(132,147,255,.10);box-shadow:0 8px 22px rgba(0,0,0,.22)}
.hero:after{content:"";position:absolute;left:7%;right:7%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(116,133,255,.26),rgba(159,104,255,.22),transparent);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px}.title-wrap h1{margin:0;display:flex;align-items:center;gap:9px;font-size:clamp(22px,2.2vw,29px);line-height:1;letter-spacing:-.65px}.title-icon{width:32px;height:32px;object-fit:contain;border-radius:9px;background:linear-gradient(145deg,#151b29,#0a0d14);border:1px solid rgba(132,148,255,.22);box-shadow:0 8px 24px rgba(0,0,0,.32),0 0 0 3px rgba(105,122,255,.035)}.title-wrap p{margin:4px 0 0;color:#7f899d;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid rgba(255,255,255,.085);background:linear-gradient(180deg,#151b27,#0f141e);color:#e0e5ee;border-radius:9px;padding:7px 10px;cursor:pointer;transition:transform .16s,background .16s,border-color .16s,box-shadow .16s;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 5px 15px rgba(0,0,0,.15)}.btn:hover{transform:translateY(-1px);background:#1a2130;border-color:rgba(133,150,255,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 9px 22px rgba(0,0,0,.2)}.btn.danger:hover{border-color:rgba(255,96,116,.22)}
.bonus-dashboard-row{display:grid;grid-template-columns:minmax(320px,370px) auto;align-items:stretch;justify-content:start;gap:10px;margin-top:7px}.search-stack{display:grid;gap:7px}.bonus-dashboard-row .bonus-box,.search-stack .event-box{margin-top:0;width:100%}.dashboard{display:grid;grid-template-columns:repeat(2,150px);gap:7px;margin:0;max-width:none;align-self:stretch;align-content:center;flex:0 0 auto}.metric{padding:8px 10px;border:1px solid rgba(255,255,255,.065);border-radius:10px;background:linear-gradient(135deg,rgba(19,25,37,.90),rgba(10,14,22,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.022),0 7px 22px rgba(0,0,0,.16)}.metric .label{font-size:9px;color:#7f899b;text-transform:uppercase;letter-spacing:1px}.metric .value{font-weight:850;font-size:17px;margin-top:1px;letter-spacing:-.2px}
.controls{display:grid;grid-template-columns:minmax(230px,1fr) auto;gap:7px;margin-top:8px}.search,.bonus-trigger{border:1px solid rgba(255,255,255,.075);background:linear-gradient(180deg,#111722,#0c111a);color:var(--text);border-radius:10px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.search{width:100%;padding:10px 12px}.search::placeholder{color:#70798b}.search:focus,.bonus-trigger:focus{border-color:rgba(102,125,255,.5);box-shadow:0 0 0 3px rgba(102,125,255,.09)}.segment{display:flex;align-items:center;background:#0b1018;border:1px solid rgba(255,255,255,.07);padding:2px;border-radius:10px}.segment .btn{border:0;box-shadow:none;border-radius:8px;padding:7px 10px;background:transparent}.segment .btn.active{background:linear-gradient(180deg,#334b93,#263763);color:#fff;box-shadow:0 5px 15px rgba(59,88,171,.2)}
.bonus-box{margin-top:7px;width:min(370px,100%);position:relative}.bonus-caption{font-size:10px;color:#8e98aa;margin:0 0 4px 2px;font-weight:750;letter-spacing:.5px}.bonus-trigger{width:100%;min-height:39px;padding:7px 34px 7px 10px;text-align:left;cursor:pointer;position:relative}.bonus-trigger:after{content:'⌄';position:absolute;right:11px;top:7px;color:#8d97a9;font-size:16px}.bonus-trigger.placeholder{color:#7e8798}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#2b3b70,#21305d);border:1px solid rgba(127,151,255,.15);color:#e2e8ff;border-radius:999px;padding:4px 7px;font-size:10px}.chip button{border:0;background:none;color:#cbd5ff;padding:0;cursor:pointer}.dropdown{display:none;position:absolute;top:100%;left:0;right:0;margin-top:5px;background:#0d131d;border:1px solid rgba(119,137,190,.28);border-radius:11px;box-shadow:0 22px 60px rgba(0,0,0,.56);overflow:hidden;z-index:40}.dropdown.open{display:block}.bonus-search{border:0;border-bottom:1px solid rgba(255,255,255,.07);border-radius:0;background:#090e16;padding:10px 11px}.options{max-height:220px;overflow:auto;padding:5px}.options::-webkit-scrollbar{width:7px}.options::-webkit-scrollbar-thumb{background:#273044;border-radius:10px}.option{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 9px;border:0;background:transparent;color:#c9d0dc;border-radius:8px;cursor:pointer;text-align:left;font-size:11px}.option:hover{background:#171e2b;color:#fff}.option.selected{background:linear-gradient(90deg,#202e50,#1c2740);color:#fff}.option .tick{opacity:0}.option.selected .tick{opacity:1;color:#83a0ff;font-weight:900}.drop-foot{padding:6px 9px;border-top:1px solid rgba(255,255,255,.065);display:flex;justify-content:space-between;color:#707b8e;font-size:10px}.clear{cursor:pointer;color:#9ba6b8}
.main{padding:20px clamp(16px,4.5vw,72px) 58px}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}.card{position:relative;background:linear-gradient(145deg,rgba(20,27,42,.985),rgba(8,12,20,.99));border:1px solid transparent;background-clip:padding-box;border-radius:16px;padding:12px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;box-shadow:0 8px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.025);isolation:isolate;overflow:hidden}.card:before{content:"";position:absolute;inset:0;border-radius:16px;padding:1px;background:linear-gradient(135deg,rgba(117,144,255,.55),rgba(255,255,255,.06) 42%,rgba(171,101,255,.42) 82%,rgba(79,210,174,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;mask-composite:exclude;pointer-events:none;z-index:-1}.card:after{content:"";position:absolute;inset:-35% -10%;background:radial-gradient(circle at 50% 0%,rgba(112,132,255,.13),transparent 38%);opacity:.65;pointer-events:none;z-index:-1}.card:hover{border-color:rgba(117,144,255,.22);box-shadow:0 10px 24px rgba(0,0,0,.24)}.card.done{background:linear-gradient(145deg,rgba(16,31,26,.98),rgba(8,17,14,.99))}.card.done:before{background:linear-gradient(135deg,rgba(61,216,144,.62),rgba(255,255,255,.045),rgba(37,148,103,.30))}.badge{position:absolute;top:8px;right:8px;background:linear-gradient(180deg,#238d62,#18704c);border:1px solid rgba(123,255,195,.13);color:#fff;font-size:8px;font-weight:850;padding:4px 6px;border-radius:999px;letter-spacing:.35px;box-shadow:0 5px 14px rgba(21,133,91,.2)}.pic{height:152px;border-radius:11px;background:radial-gradient(circle at 50% 40%,rgba(47,59,90,.62),rgba(7,11,18,.98) 73%);display:grid;place-items:center;margin-bottom:9px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 18px rgba(0,0,0,.46)}.pic img{width:58px;height:58px;max-width:none;max-height:none;object-fit:contain}.card:hover .pic img{opacity:.98}.name{font-size:14px;font-weight:820;line-height:1.25;margin-bottom:7px;min-height:35px;letter-spacing:-.1px}.effects{font-size:10.5px;line-height:1.55;color:#aeb7c6;display:grid;gap:2px}.effect{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.source-box{padding:9px 10px}
.source-row{display:flex;align-items:center;gap:6px;padding:3px 0;color:#e7fff3;font-size:10px;line-height:1.25}
.source-item-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;font-size:12px;border-radius:4px;overflow:hidden}.source-item-icon img{width:22px;height:22px;object-fit:contain;display:block}.source-gold-icon{width:18px;height:18px;border-radius:50%;background:linear-gradient(145deg,#ffe08a,#d49a18);border:1px solid rgba(255,230,130,.75);box-shadow:inset 0 0 0 2px rgba(120,75,0,.22),0 1px 3px rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;color:#7a4d00;font-size:10px;font-weight:900;flex:0 0 18px}
.source-item-name{flex:1;min-width:0}
.v2-source-logo{background:linear-gradient(145deg,#171020,#090a11);border:1px solid rgba(177,122,255,.32);box-shadow:0 0 8px rgba(136,83,255,.12)}.v2-source-logo img{width:22px;height:22px;object-fit:contain;transform:scale(1.65)}
.source-note{margin-top:6px;padding-top:5px;border-top:1px solid rgba(53,211,145,.16);font-size:8.5px;color:#73cda1}
.source-box{display:none;margin:0 0 8px;padding:8px 9px;border-radius:10px;background:linear-gradient(145deg,rgba(18,45,36,.92),rgba(8,25,20,.96));border:1px solid rgba(53,211,145,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 7px 18px rgba(0,0,0,.18)}
.source-box.show{display:block}
.source-head{display:flex;align-items:center;gap:6px;color:#72e9b2;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.65px;margin-bottom:4px}
.source-main{font-size:11px;font-weight:800;color:#e5fff2;line-height:1.3}
.source-detail{font-size:9.5px;color:#a9c9ba;line-height:1.4;margin-top:2px}
.source-note{font-size:8.5px;color:#718e81;line-height:1.35;margin-top:4px}
.source-toggle{min-width:105px}
.source-toggle.active{background:linear-gradient(180deg,#208c62,#176b4b)!important;border-color:rgba(90,255,179,.34)!important;color:#fff!important;box-shadow:0 7px 20px rgba(32,140,98,.24)!important}
@media(max-width:600px){.owned-bonus-top{align-items:flex-start}.owned-bonus-count{font-size:8px;padding:4px 7px}.owned-bonus-list{grid-template-columns:repeat(2,minmax(0,1fr))}.owned-bonus{min-height:42px;padding:7px 8px}.owned-bonus-value{font-size:13px}.owned-bonus-label{font-size:8px}.source-toggle{min-width:0}.source-main{font-size:10.5px}}
.empty{display:none;text-align:center;color:#7c8698;padding:70px 20px;font-size:13px}.empty.show{display:block}.toast{position:fixed;right:18px;bottom:18px;background:linear-gradient(180deg,#182033,#101621);border:1px solid rgba(129,148,216,.22);color:#eef2f8;padding:9px 12px;border-radius:10px;box-shadow:0 15px 40px rgba(0,0,0,.38);opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s;z-index:50;font-size:11px}.toast.show{opacity:1;transform:none}

@media(max-width:820px){.bonus-dashboard-row{display:block}.bonus-dashboard-row .dashboard{margin-top:7px;grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px;width:100%}}
@media(max-width:1400px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(max-width:1200px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls .search{grid-column:1/-1}.hero-top{align-items:flex-start}.actions{justify-content:flex-start}}@media(max-width:600px){.owned-bonus-top{align-items:flex-start}.owned-bonus-count{font-size:8px;padding:4px 7px}.owned-bonus-list{grid-template-columns:repeat(2,minmax(0,1fr))}.owned-bonus{min-height:42px;padding:7px 8px}.owned-bonus-value{font-size:13px}.owned-bonus-label{font-size:8px}.hero{padding:15px 12px 13px}.main{padding:17px 12px 40px}.hero-top{flex-direction:column;gap:10px}.actions{width:100%}.dashboard{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.controls .search{grid-column:auto}.segment{width:100%}.segment .btn{flex:1}.bonus-box{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:9px}.pic{height:148px}.pic img{width:55px;height:55px;max-width:none;max-height:none;transform:scale(1.12)}.card:hover .pic img{transform:scale(1.19)}.name{font-size:12.5px;min-height:32px}.effects{font-size:9.5px}}

.event-box{margin-top:7px;width:min(370px,100%);position:relative}

/* Event kereső: több elem látszik egyszerre */
#eventDropdown{max-height:520px}
#eventOptions{max-height:360px;overflow-y:auto}
#eventOptions .option{min-height:42px;padding:10px 12px}
#eventSearch{height:42px;font-size:14px}
#eventDropdown .drop-foot{display:flex;align-items:center;justify-content:space-between}
#eventClear{margin-left:auto;font-size:14px;padding:6px 10px;cursor:pointer}


.owned-bonus-panel{position:relative;margin:0 0 18px;padding:16px 17px 17px;border:1px solid rgba(109,125,255,.20);border-radius:16px;background:linear-gradient(145deg,rgba(17,24,39,.96),rgba(7,11,19,.985));box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 36px rgba(0,0,0,.24);overflow:hidden}
.owned-bonus-panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 180px at 8% 0%,rgba(109,125,255,.12),transparent 68%),radial-gradient(420px 160px at 92% 100%,rgba(53,211,145,.06),transparent 70%)}
.owned-bonus-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.owned-bonus-heading{display:flex;align-items:center;gap:10px}
.owned-bonus-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#263762,#151d31);border:1px solid rgba(132,148,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 7px 18px rgba(0,0,0,.22);font-size:17px}
.owned-bonus-title{font-size:12px;font-weight:900;letter-spacing:.15px;color:#f0f3ff;margin:0}
.owned-bonus-subtitle{font-size:9.5px;color:#7f899d;margin:3px 0 0}
.owned-bonus-count{flex:0 0 auto;padding:5px 9px;border-radius:999px;background:rgba(109,125,255,.10);border:1px solid rgba(125,145,255,.16);color:#aebaff;font-size:9px;font-weight:850;white-space:nowrap}
.owned-bonus-list{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}
.owned-bonus{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:45px;padding:8px 10px;border-radius:11px;background:linear-gradient(145deg,rgba(25,35,58,.90),rgba(13,20,33,.96));border:1px solid rgba(125,145,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 5px 14px rgba(0,0,0,.14)}
.owned-bonus-value{font-size:15px;font-weight:900;letter-spacing:-.25px;color:#f2f5ff;white-space:nowrap}
.owned-bonus-label{min-width:0;color:#aeb8ca;font-size:9px;font-weight:700;line-height:1.25;text-align:right}
.owned-bonus.empty{display:block;grid-column:1/-1;color:#7f899d;background:transparent;border:1px dashed rgba(255,255,255,.08);box-shadow:none;padding:11px;font-weight:500;text-align:center}
.owned-bonus-top{cursor:pointer;width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:0}
.owned-bonus-top:focus-visible{outline:2px solid rgba(109,125,255,.7);outline-offset:4px;border-radius:10px}
.owned-bonus-top-right{display:flex;align-items:center;gap:10px}.owned-bonus-chevron{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);font-size:16px;font-weight:900;transition:transform .12s ease}.owned-bonus-panel.collapsed .owned-bonus-chevron{transform:rotate(180deg)}.owned-bonus-panel.collapsed .owned-bonus-top{margin-bottom:0}.owned-bonus-list{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}.owned-bonus-panel.collapsed .owned-bonus-list{display:none}

/* Prevent accidental text/image selection on pet cards while clicking */
.card, .card * {
  -webkit-user-select: none;
  user-select: none;
}
.card img {
  -webkit-user-drag: none;
  user-drag: none;
}

</style></head>
<body><div class="app">
<header class="hero">
 <div class="hero-top"><div class="title-wrap"><h1><img id="titleIcon" class="title-icon" alt="">Venor2 Petek</h1></div><div class="actions"><button class="btn danger" id="reset">↻ Reset</button></div></div>
 <div class="controls"><input id="q" class="search" placeholder="🔎 Pet keresése..."><div class="segment"><button class="btn active" data-f="all">Összes</button><button class="btn" data-f="missing">Hiányzik</button><button class="btn" data-f="done">Megvan</button><button class="btn source-toggle" id="sourceToggle" type="button">🔑 Hogyan megszerezhető</button></div></div>
 <div class="bonus-dashboard-row"><div class="search-stack"><div class="bonus-box"><div class="bonus-caption">Keresés bónusz alapján</div><button id="bonusTrigger" class="bonus-trigger placeholder" type="button"><span id="bonusContent">Keresés</span></button><div id="bonusDropdown" class="dropdown"><input id="bonusSearch" class="search bonus-search" placeholder="Keresés"><div id="bonusOptions" class="options"></div><div class="drop-foot"><span id="bonusCount">0 kiválasztva</span><span id="bonusClear" class="clear">× Törlés</span></div></div></div><div class="event-box"><div class="bonus-caption">Keresés event alapján</div><button id="eventTrigger" class="bonus-trigger placeholder" type="button"><span id="eventContent">Összes event / kategória</span></button><div id="eventDropdown" class="dropdown"><input id="eventSearch" class="search bonus-search" placeholder="Event keresése"><div id="eventOptions" class="options"></div><div class="drop-foot"><span id="eventCount">0 kiválasztva</span><span id="eventClear" class="clear">× Törlés</span></div></div></div></div><div class="dashboard"><div class="metric"><div class="label">Megvan</div><div class="value"><span id="done">0</span> / <span id="total">0</span></div></div><div class="metric"><div class="label">Hiányzik</div><div class="value" id="missing">0</div></div></div></div>
</header>
<main class="main"><div id="ownedBonusPanel" class="owned-bonus-panel">
<button id="ownedBonusToggle" class="owned-bonus-top" type="button" aria-expanded="true" aria-controls="ownedBonusList">
  <span class="owned-bonus-heading">
    <span class="owned-bonus-icon">✦</span>
    <span><span class="owned-bonus-title">Összesített bónuszok</span></span>
  </span>
  <span class="owned-bonus-top-right">
    <span id="ownedBonusCount" class="owned-bonus-count">0 pet</span>
    <span class="owned-bonus-chevron" aria-hidden="true">⌃</span>
  </span>
</button>
<div id="ownedBonusList" class="owned-bonus-list"></div>
</div>
<div id="grid" class="grid"></div><div id="empty" class="empty">Nincs a szűrésnek megfelelő pet.</div></main>

function renderOwnedBonuses(){
  const totals={};
  const units={};
  saved.forEach(name=>{
    const pet=pets.find(p=>p.name===name);
    if(!pet)return;
    pet.stats.forEach(stat=>{
      const type=bonusTypeOf(stat);
      const m=stat.match(/[+-]?[0-9]+(?:[.,][0-9]+)?/);
      if(!m)return;
      const value=parseFloat(m[0].replace(',','.'));
      totals[type]=(totals[type]||0)+value;
      if(/%/.test(stat))units[type]='%';
    });
  });

  const entries=Object.entries(totals).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]) || a[0].localeCompare(b[0],'hu'));
  const list=$('ownedBonusList');
  const count=$('ownedBonusCount');
  count.textContent=`${saved.length} ${saved.length===1?'pet':'pet'}`;

  if(!entries.length){
    list.innerHTML='<span class="owned-bonus empty">Még nincs megszerzett pet — jelölj meg egyet a kártyáján.</span>';
    return;
  }

  list.innerHTML=entries.map(([type,value])=>{
    const rounded=Math.abs(value-Math.round(value))<1e-9?Math.round(value):Number(value.toFixed(2));
    const formatted=new Intl.NumberFormat('hu-HU').format(rounded);
    return `<span class="owned-bonus"><span class="owned-bonus-value">+${formatted}${units[type]||''}</span><span class="owned-bonus-label">${esc(type)}</span></span>`;
  }).join('');
}

function render(){
 renderOwnedBonuses();
 const q=$('q').value.toLowerCase().trim();
 let list=pets.filter(p=>p.name.toLowerCase().includes(q)&&bonusMatches(p)&&(!selectedEvent||(selectedEvent==='Egyéb'?p.category==='Egyéb':p.events.includes(selectedEvent))));
 list=list.filter(p=>filter==='all'||(filter==='done'&&saved.includes(p.name))||(filter==='missing'&&!saved.includes(p.name)));
 function statValue(stat){const m=stat.match(/[+-]?[0-9]+(?:[.,][0-9]+)?/);return m?parseFloat(m[0].replace(',','.')):0}
function bonusScore(p){
  if(selectedBonuses.length){
    return Math.max(0,...p.stats.filter(st=>selectedBonuses.includes(bonusTypeOf(st))).map(statValue));
  }
  return Math.max(0,...p.stats.map(statValue));
}
list.sort((a,b)=>a.name.localeCompare(b.name,'hu'));
 $('grid').innerHTML=list.map(p=>{const done=saved.includes(p.name);const a=acquisitionData[p.name];
const sourceHtml=sourceMode&&a?`<div class="source-box show">${(()=>{
const rows=[];
const src=a[1]||[];
for(let i=0;i<src.length;i++){
  const raw=String(src[i]).trim();
  const qm=raw.match(/^×\s*([\d\s]+)$/i);
  const goldm=raw.match(/^([\d\s]+)\s+arany$/i);
  if(qm&&rows.length){ rows[rows.length-1].qty='×'+qm[1].trim(); }
  else if(goldm&&rows.length&&/^arany$/i.test(rows[rows.length-1].name)){ rows[rows.length-1].qty='×'+goldm[1].trim(); }
  else { rows.push({name:raw,qty:''}); }
}
const cleaned=p.name==='Gobby'?rows:rows.filter((r,idx)=>!( !r.qty && rows.some((x,j)=>j!==idx&&x.name===r.name&&x.qty) ));
return cleaned.map(r=>{
  const name=r.name;
  const isGold=/^arany$/i.test(name)||/\barany\b/i.test(name)&&!itemIcons[name];
  const icon=itemIcons[name];
  const petRef=pets.find(pp=>pp.name===name);
  const iconHtml=icon?`<span class="source-item-icon"><img src="${icon}" alt="" loading="lazy" decoding="async"></span>`:petRef?`<span class="source-item-icon"><img src="${petRef.img}" alt="" loading="lazy" decoding="async"></span>`:isGold&&itemIcons["Arany"]?`<span class="source-item-icon"><img src="${itemIcons["Arany"]}" alt="" loading="lazy" decoding="async"></span>`:isGold?`<span class="source-gold-icon">G</span>`:`<span class="source-item-icon v2-source-logo"><img src="${VENOR2_LOGO}" alt="Venor2" loading="lazy" decoding="async"></span>`;
  const displayName=r.qty ? `${name} ${r.qty}` : name;
  return `<div class="source-row">${iconHtml}<span class="source-item-name">${esc(displayName)}</span></div>`;
}).join('')
})()}${a[0]?`<div class="source-note">${esc(a[0])}</div>`:''}</div>`:'';
return `<div class="card ${done?'done':''}" data-n="${esc(p.name)}">${done?'<span class="badge">✓ MEGVAN</span>':''}<div class="pic"><img src="${p.img}" alt="${esc(p.name)}" loading="eager" decoding="async"></div><div class="name">${esc(p.name)}</div>${sourceHtml}<div class="effects">${p.stats.map(x=>`<span class="effect">${esc(x)}</span>`).join('')}</div></div>`}).join('');
